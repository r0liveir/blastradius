[project]
name = "blastradius"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wate", email = "ryan.o2712@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
blastradius = "blastradius:main"

[tool.pytest.ini_options]
pythonpath = ["src", "benchmark"]
testpaths = ["benchmark/tests", "tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
